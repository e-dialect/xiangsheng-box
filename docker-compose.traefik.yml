services:
  traefik:
    image: traefik:v3.1
    container_name: ${TRAEFIK_CONTAINER:-guantou-traefik}
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - guantou

  backend:
    build:
      context: ./backend/guantou
    image: ${BACKEND_IMAGE:-guantou-backend}
    container_name: ${BACKEND_CONTAINER:-guantou-backend}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_KEY: ${JWT_KEY:-dev-jwt-key}
      PRODUCT_EVENT_RETENTION_DAYS: ${PRODUCT_EVENT_RETENTION_DAYS:-90}
      COS_SECRET_ID: ${COS_SECRET_ID:-DEFAULT_COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-DEFAULT_COS_SECRET_KEY}
      COS_BUCKET: ${COS_BUCKET:-DEFAULT_COS_BUCKET}
      COS_REGION: ${COS_REGION:-DEFAULT_COS_REGION}
      APP_ID: ${APP_ID:-DEFAULT_APP_ID}
      APP_SECRET: ${APP_SECRET:-${APP_SECRECT:-DEFAULT_APP_SECRET}}
      APP_SECRECT: ${APP_SECRECT:-${APP_SECRET:-DEFAULT_APP_SECRET}}
      WEB_APP_ID: ${WEB_APP_ID:-}
      WEB_APP_SECRET: ${WEB_APP_SECRET:-}
      EMAIL_HOST: ${EMAIL_HOST:-DEFAULT_EMAIL_HOST}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-DEFAULT_EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-DEFAULT_EMAIL_HOST_PASSWORD}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-true}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_CODE_TTL_SECONDS: ${EMAIL_CODE_TTL_SECONDS:-600}
      EMAIL_CODE_THROTTLE_SECONDS: ${EMAIL_CODE_THROTTLE_SECONDS:-60}
      EMAIL_CODE_MAX_ATTEMPTS: ${EMAIL_CODE_MAX_ATTEMPTS:-5}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-DEFAULT_DEFAULT_FROM_EMAIL}
      SQLITE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      LOG_DIR: /data/logs
    volumes:
      - ./data/backend:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/site-settings/carousel', timeout=3).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.guantou-backend.entrypoints=web"
      - "traefik.http.routers.guantou-backend.rule=Host(`api.guantou.localhost`)"
      - "traefik.http.services.guantou-backend.loadbalancer.server.port=8000"
    networks:
      - guantou

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PHONE_CODE_LOGIN_ENABLED: ${VITE_PHONE_CODE_LOGIN_ENABLED:-false}
    image: ${FRONTEND_IMAGE:-guantou-frontend}
    container_name: ${FRONTEND_CONTAINER:-guantou-frontend}
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: ${TRAEFIK_FRONTEND_BACKEND_URL:-http://api.guantou.localhost}
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.guantou-frontend.entrypoints=web"
      - "traefik.http.routers.guantou-frontend.rule=Host(`guantou.localhost`)"
      - "traefik.http.services.guantou-frontend.loadbalancer.server.port=8080"
    networks:
      - guantou

networks:
  guantou:
    name: ${COMPOSE_PROJECT_NAME:-guantou}-traefik-network
