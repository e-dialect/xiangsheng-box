openapi: 3.0.3
info:
  title: 乡声集盒 Entry / Recording API
  version: 1.0.0
  description: |
    当前公开领域契约。Entry 是同一个词及其读音身份，EntrySense 是编号义，
    Recording 是一次录音；二者通过带角色的 RecordingEntryLink 多对多关联。
    已退役的 Can、Nameplate、Flavor、Package 与自动选主接口不属于本契约。
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
tags:
  - name: Collections
    description: 以词条为目录的主题集盒。
  - name: Entries
    description: 词条、编号义和地区读音。
  - name: Recordings
    description: 录音及其与词条的多对多关系。
  - name: Reference
    description: 写法、概念和不可覆写依据。
  - name: Curation
    description: 整理授权、申请、待办和可追溯操作。
  - name: Platform
    description: 客户端能力与隐私最小化的产品事件。
security:
  - bearerAuth: []
paths:
  /collections/:
    get:
      tags:
        - Collections
      operationId: listCollections
      summary: 浏览公开集盒或自己的集盒
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionPage"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      security: []
      parameters:
        - name: mine
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
    post:
      tags:
        - Collections
      operationId: createCollection
      summary: 创建集盒，默认私有
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreate"
  /collections/{collection_id}/:
    get:
      tags:
        - Collections
      operationId: getCollection
      summary: 打开词条目录与地区录音
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      security: []
    parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      tags:
        - Collections
      operationId: updateCollection
      summary: 修改盒签和公开状态
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionWrite"
    delete:
      tags:
        - Collections
      operationId: deleteCollection
      summary: 删除集盒，保留原始资料
      responses:
        "204":
          description: 已完成
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
  /collections/{collection_id}/entries/:
    post:
      tags:
        - Collections
      operationId: addCollectionEntry
      summary: 收进词条，不自动收录音
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    minimum: 1
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry_id:
                  type: integer
                  minimum: 1
              required:
                - entry_id
    parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /collections/{collection_id}/recordings/:
    post:
      tags:
        - Collections
      operationId: addCollectionRecording
      summary: 指定录音盒内归属，未关联时进入待整理区
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    minimum: 1
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recording_id:
                  type: integer
                  minimum: 1
                entry_id:
                  type: integer
                  nullable: true
              required:
                - recording_id
    parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /collections/{collection_id}/entries/{item_id}/:
    delete:
      tags:
        - Collections
      operationId: removeCollectionEntries
      summary: 移出集盒，保留原始资料
      responses:
        "204":
          description: 已完成
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
    parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /collections/{collection_id}/recordings/{item_id}/:
    delete:
      tags:
        - Collections
      operationId: removeCollectionRecordings
      summary: 移出集盒，保留原始资料
      responses:
        "204":
          description: 已完成
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
    parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /collections/{collection_id}/order/:
    post:
      tags:
        - Collections
      operationId: orderCollection
      summary: 对目录或目录内录音排序
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ordered:
                    type: boolean
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                section_id:
                  type: integer
                  nullable: true
              required:
                - ids
    parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /recordings/daily/:
    get:
      tags:
        - Recordings
      operationId: dailyRecording
      summary: 公开乡音发现
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingV2"
        "204":
          description: 没有公开候选
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      security: []
  /recordings/random/:
    get:
      tags:
        - Recordings
      operationId: randomRecording
      summary: 公开乡音发现
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingV2"
        "204":
          description: 没有公开候选
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      security: []
  /recordings/{recording_id}/like/:
    put:
      tags:
        - Recordings
      operationId: likeRecording
      summary: 点赞或取消点赞
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
    parameters:
      - name: recording_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      tags:
        - Recordings
      operationId: unlikeRecording
      summary: 点赞或取消点赞
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
  /recording-comments/{comment_id}/like/:
    put:
      tags:
        - Recordings
      operationId: likeRecordingComment
      summary: 点赞或取消点赞
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
    parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      tags:
        - Recordings
      operationId: unlikeRecordingComment
      summary: 点赞或取消点赞
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
  /recording-comments/:
    get:
      tags:
        - Recordings
      operationId: listRecordingComments
      summary: 录音留言及一层回复
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingCommentPage"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      security: []
      parameters:
        - name: recording_id
          in: query
          schema:
            type: integer
            minimum: 1
          required: true
        - name: parent_id
          in: query
          description: 提供时返回该一级评论下的一层回复
          schema:
            type: integer
            nullable: true
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
    post:
      tags:
        - Recordings
      operationId: createRecordingComment
      summary: 发送留言，同一作者 UUID 幂等重试
      responses:
        "200":
          description: 返回原有评论
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingComment"
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingComment"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingCommentWrite"
  /recording-comments/{comment_id}/:
    delete:
      tags:
        - Recordings
      operationId: hideRecordingComment
      summary: 作者删除或管理员隐藏留言
      responses:
        "204":
          description: 已完成
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
    parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /entry-comments/{comment_id}/like/:
    put:
      tags:
        - Entries
      operationId: likeEntryComment
      summary: 点赞或取消点赞
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
    parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      tags:
        - Entries
      operationId: unlikeEntryComment
      summary: 点赞或取消点赞
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
  /entry-comments/:
    get:
      tags:
        - Entries
      operationId: listEntryComments
      summary: 词条留言及一层回复
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryCommentPage"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      security: []
      parameters:
        - name: entry_id
          in: query
          schema:
            type: integer
            minimum: 1
          required: true
        - name: parent_id
          in: query
          description: 提供时返回该一级评论下的一层回复
          schema:
            type: integer
            nullable: true
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
    post:
      tags:
        - Entries
      operationId: createEntryComment
      summary: 发送留言，同一作者 UUID 幂等重试
      responses:
        "200":
          description: 返回原有评论
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryComment"
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryComment"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryCommentWrite"
  /entry-comments/{comment_id}/:
    delete:
      tags:
        - Entries
      operationId: hideEntryComment
      summary: 作者删除或管理员隐藏留言
      responses:
        "204":
          description: 已完成
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
    parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /entries/suggestions/:
    get:
      tags:
        - Entries
      operationId: suggestionsEntries
      summary: 公开词条联想或互动推荐（最多八条）
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntryV2"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
  /entries/popular/:
    get:
      tags:
        - Entries
      operationId: popularEntries
      summary: 公开词条联想或互动推荐（最多八条）
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntryV2"
        "400":
          description: 输入错误或归属关系不合法
        "403":
          description: 无写入权限
        "404":
          description: 对象不存在或不可见
      security: []
  /entries/:
    get:
      tags: [Entries]
      operationId: listEntries
      summary: 按词条优先查询
      security: []
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: dialect_id, in: query, schema: { type: integer } }
        - { name: dialect_scope, in: query, schema: { type: string, enum: [exact, subtree] } }
        - { name: has_recording, in: query, schema: { type: boolean } }
        - { name: ipa, in: query, schema: { type: string } }
        - { name: romanization, in: query, schema: { type: string } }
      responses:
        "200": { description: 词条列表, content: { application/json: { schema: { $ref: "#/components/schemas/EntryPage" } } } }
    post:
      tags: [Entries]
      operationId: createEntry
      summary: 创建词条初稿
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntryV2" } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/EntryV2" } } } }
  /entries/bookmarks/:
    get:
      tags: [Entries]
      operationId: listEntryBookmarks
      summary: 获取我的词条收藏
      responses:
        "200": { description: 收藏的词条, content: { application/json: { schema: { $ref: "#/components/schemas/EntryPage" } } } }
  /entries/{entry_id}/:
    parameters:
      - { $ref: "#/components/parameters/EntryId" }
    get:
      tags: [Entries]
      operationId: getEntry
      summary: 获取词条详情
      security: []
      responses:
        "200": { description: 词条详情, content: { application/json: { schema: { $ref: "#/components/schemas/EntryV2" } } } }
    patch:
      tags: [Entries]
      operationId: updateEntry
      summary: 修订词条
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntryV2" } } }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/EntryV2" } } } }
  /entries/{entry_id}/bookmark/:
    parameters:
      - { $ref: "#/components/parameters/EntryId" }
    put:
      tags: [Entries]
      operationId: bookmarkEntry
      summary: 收藏词条
      responses:
        "200": { description: 收藏状态, content: { application/json: { schema: { $ref: "#/components/schemas/BookmarkResult" } } } }
    delete:
      tags: [Entries]
      operationId: unbookmarkEntry
      summary: 取消收藏词条
      responses:
        "200": { description: 收藏状态, content: { application/json: { schema: { $ref: "#/components/schemas/BookmarkResult" } } } }
  /entry-senses/:
    get:
      tags: [Entries]
      operationId: listEntrySenses
      summary: 查询编号义
      security: []
      responses:
        "200": { description: 编号义列表, content: { application/json: { schema: { $ref: "#/components/schemas/EntrySensePage" } } } }
    post:
      tags: [Entries]
      operationId: createEntrySense
      summary: 补充编号义
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntrySenseV2" } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/EntrySenseV2" } } } }
  /entry-senses/{sense_id}/:
    parameters:
      - { $ref: "#/components/parameters/SenseId" }
    get:
      tags: [Entries]
      operationId: getEntrySense
      summary: 获取编号义
      security: []
      responses:
        "200": { description: 编号义, content: { application/json: { schema: { $ref: "#/components/schemas/EntrySenseV2" } } } }
    patch:
      tags: [Entries]
      operationId: updateEntrySense
      summary: 修订编号义
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntrySenseV2" } } }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/EntrySenseV2" } } } }
  /writing-forms/:
    get:
      tags: [Reference]
      operationId: listWritingForms
      summary: 查询写法
      security: []
      responses:
        "200": { description: 写法列表, content: { application/json: { schema: { type: object } } } }
  /concepts/:
    get:
      tags: [Reference]
      operationId: listConcepts
      summary: 查询抽象概念
      security: []
      responses:
