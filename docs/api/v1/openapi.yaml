components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    EntryId: { name: entry_id, in: path, required: true, schema: { type: integer } }
    SenseId: { name: sense_id, in: path, required: true, schema: { type: integer } }
    VariantId: { name: variant_id, in: path, required: true, schema: { type: integer } }
    RecordingId: { name: recording_id, in: path, required: true, schema: { type: integer } }
    LinkId: { name: link_id, in: path, required: true, schema: { type: integer } }
    AttestationId: { name: attestation_id, in: path, required: true, schema: { type: integer } }
    EvidenceId: { name: evidence_id, in: path, required: true, schema: { type: integer } }
    GrantId: { name: grant_id, in: path, required: true, schema: { type: integer } }
    ApplicationId: { name: application_id, in: path, required: true, schema: { type: integer } }
    ActionId: { name: action_id, in: path, required: true, schema: { type: integer } }
  schemas:
    Collection:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        owner_id:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        is_public:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
    CollectionCreate:
      allOf:
        - $ref: "#/components/schemas/CollectionWrite"
        - type: object
          required: [title]
    CollectionWrite:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        is_public:
          type: boolean
          default: false
    CollectedRecording:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        recording:
          $ref: "#/components/schemas/RecordingV2"
        needs_review:
          type: boolean
    CollectionSection:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        entry:
          $ref: "#/components/schemas/EntryV2"
        recordings:
          type: array
          items:
            $ref: "#/components/schemas/CollectedRecording"
        recording_count:
          type: integer
          minimum: 0
    CollectionDetail:
      allOf:
        - $ref: "#/components/schemas/Collection"
        - type: object
          properties:
            unavailable_count:
              type: integer
              description: 仅所有者可见的暂不可见收纳记录数量
            editable:
              type: boolean
            sections:
              type: array
              items:
                $ref: "#/components/schemas/CollectionSection"
            pending:
              type: array
              items:
                $ref: "#/components/schemas/CollectedRecording"
            entry_count:
              type: integer
            recording_count:
              type: integer
              description: 去重后的可见录音数
    CommentReply:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        parent_id:
          type: integer
        body:
          type: string
        author_id:
          type: integer
          nullable: true
        author_name:
          type: string
        created_at:
          type: string
          format: date-time
        reply_to_id:
          type: integer
          nullable: true
        reply_to_author_name:
          type: string
        like_count:
          type: integer
        liked:
          type: boolean
        editable:
          type: boolean
    RecordingComment:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        recording_id:
          type: integer
          minimum: 1
        entry_id:
          type: integer
          nullable: true
        parent_id:
          type: integer
          nullable: true
        body:
          type: string
        author_id:
          type: integer
          nullable: true
        author_name:
          type: string
        created_at:
          type: string
          format: date-time
        reply_to_id:
          type: integer
          nullable: true
        reply_to_author_name:
          type: string
        reply_count:
          type: integer
          minimum: 0
        recent_replies:
          type: array
          items:
            $ref: "#/components/schemas/CommentReply"
        deleted:
          type: boolean
        like_count:
          type: integer
        liked:
          type: boolean
        editable:
          type: boolean
    RecordingCommentWrite:
      type: object
      properties:
        recording_id:
          type: integer
          minimum: 1
        parent_id:
          type: integer
          nullable: true
        reply_to_id:
          type: integer
          nullable: true
        body:
          type: string
          minLength: 1
          maxLength: 2000
        client_id:
          type: string
          format: uuid
      required:
        - recording_id
        - body
        - client_id
    EntryComment:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        entry_id:
          type: integer
          minimum: 1
        recording_id:
          type: integer
          nullable: true
        parent_id:
          type: integer
          nullable: true
        body:
          type: string
        author_id:
          type: integer
          nullable: true
        author_name:
          type: string
        created_at:
          type: string
          format: date-time
        reply_to_id:
          type: integer
          nullable: true
        reply_to_author_name:
          type: string
        reply_count:
          type: integer
          minimum: 0
        recent_replies:
          type: array
          items:
            $ref: "#/components/schemas/CommentReply"
        deleted:
          type: boolean
        like_count:
          type: integer
        liked:
          type: boolean
        editable:
          type: boolean
    EntryCommentWrite:
      type: object
      properties:
        entry_id:
          type: integer
          minimum: 1
        parent_id:
          type: integer
          nullable: true
        reply_to_id:
          type: integer
          nullable: true
        body:
          type: string
          minLength: 1
          maxLength: 2000
        client_id:
          type: string
          format: uuid
      required:
        - entry_id
        - body
        - client_id
    LikeResult:
      type: object
      properties:
        liked:
          type: boolean
        like_count:
          type: integer
          minimum: 0
    CollectionPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/Collection"
    RecordingCommentPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/RecordingComment"
    EntryCommentPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/EntryComment"
    DialectRef:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        qualified_code: { type: string, description: 仅供 API、历史映射和管理工具使用 }
        path_names: { type: array, items: { type: string } }
        sort_order: { type: integer }
    UserRef:
      type: object
      nullable: true
      properties:
        id: { type: integer, nullable: true }
        username: { type: string }
        nickname: { type: string }
    EntryV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        display_writing: { type: string, readOnly: true }
        summary: { type: string }
        identity_note: { type: string }
        usage_dialect: { $ref: "#/components/schemas/DialectRef" }
        status: { type: string, enum: [draft, reviewed, disputed, rejected] }
        visibility: { type: boolean }
        recording_count: { type: integer, readOnly: true }
        needs_audio: { type: boolean, readOnly: true }
        is_bookmarked: { type: boolean, readOnly: true }
        senses: { type: array, items: { $ref: "#/components/schemas/EntrySenseV2" }, readOnly: true }
        pronunciation_variants: { type: array, items: { $ref: "#/components/schemas/PronunciationVariantV2" }, readOnly: true }
        recording_links: { type: array, items: { $ref: "#/components/schemas/RecordingEntryLinkV2" }, readOnly: true }
    EntrySenseV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        entry: { type: integer }
        sense_number: { type: integer }
        gloss: { type: string }
        usage_note: { type: string }
        status: { type: string, enum: [draft, reviewed, disputed, rejected] }
        concepts: { type: array, items: { type: object }, readOnly: true }
    PronunciationVariantV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        entry: { type: integer }
        dialect: { $ref: "#/components/schemas/DialectRef" }
        ipa: { type: string }
        base_romanization: { type: string }
        surface_romanization: { type: string }
        reading_type: { type: string }
        status: { type: string, enum: [draft, reviewed, disputed, rejected] }
    RecordingV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        audio_url: { type: string, format: uri }
        usage_dialect: { $ref: "#/components/schemas/DialectRef" }
        recorder: { $ref: "#/components/schemas/UserRef" }
        duration_ms: { type: integer, minimum: 0 }
        rights_statement: { type: string }
        like_count: { type: integer, readOnly: true }
        liked: { type: boolean, readOnly: true }
        comment_count: { type: integer, readOnly: true }
        original_gloss: { type: string }
        recording_type: { type: string, enum: [word, phrase, example, other] }
        status: { type: string, enum: [draft, published, disputed, rejected] }
        visibility: { type: boolean }
        entry_links: { type: array, items: { $ref: "#/components/schemas/RecordingEntryLinkRef" }, readOnly: true }
    RecordingEntryLinkRef:
      type: object
      properties:
        id: { type: integer }
        entry: { $ref: "#/components/schemas/EntryV2" }
        sense_id: { type: integer, nullable: true }
        role: { type: string, enum: [primary, mention, competing] }
        status: { type: string, enum: [suggested, accepted, disputed, rejected] }
        is_current: { type: boolean }
    RecordingEntryLinkV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        recording: { type: integer }
        entry: { type: integer }
        role: { type: string, enum: [primary, mention, competing] }
        status: { type: string, enum: [suggested, accepted, disputed, rejected] }
        is_current: { type: boolean }
    UsageAttestationV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        entry: { type: integer }
        dialect: { $ref: "#/components/schemas/DialectRef" }
        attester: { $ref: "#/components/schemas/UserRef" }
        active: { type: boolean }
    EvidenceRecordV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        source_type: { type: string }
        original_text: { type: string }
        original_writing: { type: string }
        original_gloss: { type: string }
        original_pronunciation: { type: string }
        citation: { type: string }
    CuratorGrantV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        user: { $ref: "#/components/schemas/UserRef" }
        role: { type: string, enum: [lexical, regional] }
        dialect: { $ref: "#/components/schemas/DialectRef" }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        reason: { type: string }
        is_active: { type: boolean, readOnly: true }
    CuratorApplicationV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        applicant: { $ref: "#/components/schemas/UserRef" }
        role: { type: string, enum: [lexical, regional] }
        dialect: { $ref: "#/components/schemas/DialectRef" }
        statement: { type: string }
        experience: { type: string }
        status: { type: string, enum: [pending, approved, rejected, withdrawn] }
        review_reason: { type: string }
    CurationActionV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        actor: { $ref: "#/components/schemas/UserRef" }
        action_type: { type: string }
        target_type: { type: string }
        target_id: { type: integer }
