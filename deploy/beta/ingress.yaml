apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: xiangsheng-dual-beta
spec:
  ingressClassName: edialect-public
  entryPoints:
    - websecure
  tls:
    certResolver: tencentcloud
  routes:
    # App and Django both ship /static/ files. Keep the share image and licenses on H5.
    - kind: Rule
      match: (Host(`box.test.edialect.top`) || Host(`pxm.test.edialect.top`)) && (Path(`/static/share-cover.png`) || PathPrefix(`/static/licenses/`))
      priority: 110
      services:
        - name: frontend
          port: 8080
          passHostHeader: true
    - kind: Rule
      match: (Host(`box.test.edialect.top`) || Host(`pxm.test.edialect.top`)) && PathRegexp(`^/(admin|static|users|login|announcements|site-settings|files|notifications|entry-comments|collections|recording-comments|dialects|circles|entries|entry-senses|writing-forms|concepts|pronunciation-variants|recordings|recording-entry-links|usage-attestations|evidence-records|curator-grants|curator-applications|curation|contributions|themes|decorations|product-events|local-tools)(/|$)`)
      priority: 100
      services:
        - name: backend
          port: 8000
          passHostHeader: true
    # Supersede the old, host-only PXM web rule while keeping it available for cutback.
    - kind: Rule
      match: Host(`box.test.edialect.top`) || Host(`pxm.test.edialect.top`)
      priority: 60
      services:
        - name: frontend
          port: 8080
          passHostHeader: true
