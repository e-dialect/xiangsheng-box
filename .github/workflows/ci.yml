name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR commit messages
        run: node scripts/check-commit-messages.js "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/guantou
    env:
      SECRET_KEY: ci-secret-key
      JWT_KEY: ci-jwt-key
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/guantou/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test config guantou announcements user siteconfig files inbox audit themes productanalytics

      - name: Check backend formatting
        run: black --check announcements guantou user siteconfig files inbox audit utils config themes productanalytics

      - name: Run material tool tests
        working-directory: .
        run: python -m unittest discover tools/materials/tests

      - name: Check implementation against API contract
        working-directory: .
        run: python tools/api_contract/check_contract.py

      - name: Lint OpenAPI contract
        working-directory: .
        run: npx --yes @redocly/cli@1.34.5 lint --config docs/api/redocly.yaml docs/api/v1/openapi.yaml

  frontend-unit:
    name: Frontend Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --production=false

      - name: Lint frontend
        run: yarn lint

      - name: Run frontend unit tests
        run: yarn test:unit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --production=false

      - name: Build H5 frontend
        run: yarn build:h5:checked

      - name: Build WeChat mini program frontend
        run: yarn build:mp-weixin:checked

  e2e-h5:
    name: H5 E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - docker
      - frontend-build
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v8
        with:
          name: ci-docker-images-${{ github.run_id }}
          path: ${{ runner.temp }}/docker-images

      - name: Load Docker images
        run: |
          docker load --input "${RUNNER_TEMP}/docker-images/guantou-backend.tar"
          docker load --input "${RUNNER_TEMP}/docker-images/guantou-frontend.tar"
          docker image inspect guantou-backend:latest guantou-frontend:latest >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --production=false

      - name: Install Playwright browser
        working-directory: frontend
        run: yarn playwright install --with-deps chromium

      - name: Start Docker stack
        run: docker compose up -d

      - name: Wait for H5 stack
        working-directory: frontend
        run: yarn wait:e2e:h5

      - name: Run H5 smoke tests
        working-directory: frontend
        run: yarn test:e2e:h5

      - name: Show stack and application logs on failure
        if: failure()
        run: |
          docker compose logs --no-color backend frontend || true
          if [ -d data/backend/logs ]; then
            find data/backend/logs -maxdepth 1 -type f -print -exec tail -n 200 {} \;
          fi

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/guantou
          tags: guantou-backend:latest
          outputs: type=docker,dest=${{ runner.temp }}/guantou-backend.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          tags: guantou-frontend:latest
          outputs: type=docker,dest=${{ runner.temp }}/guantou-frontend.tar
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Upload Docker images
        uses: actions/upload-artifact@v7
        with:
          name: ci-docker-images-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/guantou-backend.tar
            ${{ runner.temp }}/guantou-frontend.tar
          compression-level: 0
          retention-days: 1
          overwrite: true

  release-safety:
    name: Release safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install release test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Verify release authorization and immutable images
        run: python -m unittest discover -s scripts -p 'test_release*.py' -v

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - commit-messages
      - backend
      - frontend-unit
      - frontend-build
      - e2e-h5
      - docker
      - release-safety
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI job
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'JS'
          const jobs = JSON.parse(process.env.NEEDS);
          for (const [name, job] of Object.entries(jobs)) {
            const expected = name === 'commit-messages' && process.env.EVENT_NAME !== 'pull_request' ? 'skipped' : 'success';
            if (job.result !== expected) throw new Error(`${name}: expected ${expected}, received ${job.result}`);
          }
          JS
